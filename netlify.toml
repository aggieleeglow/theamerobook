# Static site — no build step. Push to GitHub deploys when the repo is linked in Netlify.
[build]
  publish = "."

# Netlify serves index.html at / by default; map root to the marketing landing page.
[[redirects]]
  from = "/"
  to = "/the-amero-book.html"
  status = 200

# Friendly-URL redirects
[[redirects]]
  from = "/grubel"
  to = "/research/grubel-1999.html"
  status = 301

[[redirects]]
  from = "/research"
  to = "/research/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

# Default headers — secure, search-friendly
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
