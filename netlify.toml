# Static site with clean URLs
[build]
  publish = "."

# Headers for SEO and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect old single-page URL to new homepage
[[redirects]]
  from = "/the-amero-book.html"
  to = "/"
  status = 301

# Trailing slash enforcement for clean URLs
[[redirects]]
  from = "/book"
  to = "/book/"
  status = 301

[[redirects]]
  from = "/digital-amero"
  to = "/digital-amero/"
  status = 301

