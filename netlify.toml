# Static site — no build step. Push to GitHub deploys when the repo is linked in Netlify.
[build]
  publish = "."

# Netlify serves index.html at / by default; map root to this page.
[[redirects]]
  from = "/"
  to = "/the-amero-book.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
